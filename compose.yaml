services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    build:
      context: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PROFILE: local
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-studio}
      DB_USER: ${POSTGRES_USER:-studio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    ports:
      - "${APP_PORT:-8089}:8080"

volumes:
  pgdata:
