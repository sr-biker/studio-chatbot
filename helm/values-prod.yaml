image:
  repository: "<ECR_REPO_URL>/senthil-studio-chatbot"
  tag: "latest"

replicaCount: 2

environment: prod

config:
  appProfile: prod
  dbHost: pgvector
  dbPort: "5432"
  dbName: studio
  dbUser: studio
  # The FAQ Google Doc's file ID (from its share URL: /file/d/<ID>/view).
  faqGoogleDocId: "1Z3E0TVsPsNY5_GDD-MYtp2tFpV87Ybu9"
  # Chat model is OpenAI direct, same as local -- override to a stronger model for prod here
  # if desired (e.g. gpt-4o); OPENAI_API_KEY (secrets.openaiApiKey) is required either way.
  chatModelName: gpt-4o-mini
  # Cheap/fast tier for the summarize agent -- gpt-5-nano is OpenAI's Haiku-equivalent tier.
  summarizeModelName: gpt-5-nano
  # LangSmith tracing -- also needs secrets.langchainApiKey set (not checked in, via --set
  # at deploy time). Traces real prod /chat requests -- see README's "Observability" section
  # for the redaction/sampling question before enabling this against real user traffic.
  langchainTracing: false
  langchainProject: studio-chatbot-prod
  # Pins the exact LangSmith Hub prompt commit each agent runs in prod -- see app/prompts.py
  # and scripts/promote_prompt.py. Default in app/config.py is "latest", which is right for
  # local dev but wrong here: prod must not pick up a CSR's in-progress Hub edit until
  # promote_prompt.py has verified it (judge pass rate + RAGAS) and this hash is bumped by
  # hand. The commit is also tagged "prod" on the Hub itself for visibility in the UI, but
  # that tag is just a human label -- the SDK has no tag-based ref, so this hash is the
  # actual source of truth for what prod runs.
  supportPromptRef: da0aa7662333e3c5af9da256ff527188044c9dba14816d4a2b04d51b627efca5
  # prod also needs DB_SECRET_NAME + AWS_REGION -- set via --set at deploy time (not checked
  # in) since they're environment/account specific.

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
