apiVersion: v1
kind: Service
metadata:
  name: {{ include "studio-chatbot.name" . }}
  labels:
    {{- include "studio-chatbot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "studio-chatbot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
