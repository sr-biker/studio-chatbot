apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "studio-chatbot.name" . }}-config
  labels:
    {{- include "studio-chatbot.labels" . | nindent 4 }}
data:
  APP_PROFILE: {{ .Values.config.appProfile | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  {{- if .Values.config.faqGoogleDocId }}
  FAQ_GOOGLE_DOC_ID: {{ .Values.config.faqGoogleDocId | quote }}
  {{- end }}
  {{- if .Values.secrets.googleServiceAccountKey }}
  GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/credentials.json
  {{- end }}
  {{- if .Values.config.chatModelName }}
  CHAT_MODEL_NAME: {{ .Values.config.chatModelName | quote }}
  {{- end }}
  {{- if .Values.config.summarizeModelName }}
  SUMMARIZE_MODEL_NAME: {{ .Values.config.summarizeModelName | quote }}
  {{- end }}
  {{- if .Values.config.awsRegion }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  {{- end }}
  {{- if .Values.config.dbSecretName }}
  DB_SECRET_NAME: {{ .Values.config.dbSecretName | quote }}
  {{- end }}
  {{- if .Values.config.langchainTracing }}
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: {{ .Values.config.langchainProject | quote }}
  {{- end }}
  {{- if .Values.config.supportPromptRef }}
  SUPPORT_PROMPT_REF: {{ .Values.config.supportPromptRef | quote }}
  {{- end }}
  {{- if .Values.config.generalPromptRef }}
  GENERAL_PROMPT_REF: {{ .Values.config.generalPromptRef | quote }}
  {{- end }}
  {{- if .Values.config.membershipPromptRef }}
  MEMBERSHIP_PROMPT_REF: {{ .Values.config.membershipPromptRef | quote }}
  {{- end }}
