apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgvector.name" . }}-credentials
  labels:
    {{- include "pgvector.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
