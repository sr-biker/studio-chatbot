apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgvector.name" . }}-init
  labels:
    {{- include "pgvector.labels" . | nindent 4 }}
data:
  # Only runs on first initdb (empty PGDATA) -- the postgres image scans
  # /docker-entrypoint-initdb.d/*.sql once, at cluster creation, not on every restart.
  01-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
