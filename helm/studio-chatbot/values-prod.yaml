image:
  repository: "<ECR_REPO_URL>/senthil-studio-chatbot"
  tag: "latest"

replicaCount: 2

environment: prod

config:
  appProfile: prod
  dbHost: pgvector
  dbPort: "5432"
  dbName: studio
  dbUser: studio
  faqS3Bucket: senthil-studio-faq
  faqS3Key: faq.md
  # prod also needs DB_SECRET_NAME + AWS_REGION + BEDROCK_CHAT_MODEL_ID -- set via
  # --set at deploy time (not checked in) since they're environment/account specific.

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
